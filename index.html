<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183a93">
<title>Better Edge Solutions Inc. - Portal</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--ink:#14213d;--mut:#6a7592;--line:rgba(24,58,147,.14);--navy:#183a93;--cy:#27cdff;--mg:#d92aa1;--ok:#14835d;--bad:#b94351;--warn:#a8680f;--glass:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.58));--gb:rgba(255,255,255,.9);--fld:rgba(255,255,255,.85);--tint:rgba(24,58,147,.06)}
body.dark{--ink:#e8ecf7;--mut:#9aa7c7;--line:rgba(255,255,255,.13);--glass:linear-gradient(180deg,rgba(34,46,90,.76),rgba(18,26,54,.66));--gb:rgba(255,255,255,.12);--fld:rgba(255,255,255,.07);--tint:rgba(255,255,255,.06);--navy:#8fb0ff;--ok:#6fe0b6;--bad:#ff9aa4;--warn:#f2c46e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,Arial,sans-serif;background:radial-gradient(900px 520px at 6% -8%,rgba(39,205,255,.32),transparent 60%),radial-gradient(800px 520px at 100% 0,rgba(217,42,161,.2),transparent 60%),radial-gradient(900px 600px at 50% 112%,rgba(24,58,147,.26),transparent 60%),#eef2fb;background-attachment:fixed}
body.dark{background:radial-gradient(900px 520px at 6% -8%,rgba(39,205,255,.16),transparent 60%),radial-gradient(800px 520px at 100% 0,rgba(217,42,161,.16),transparent 60%),#0a1128;background-attachment:fixed}
.hide{display:none!important}h1,h2,h3,p{margin:0}
.glass{background:var(--glass);border:1px solid var(--gb);border-radius:18px;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 30px rgba(24,58,147,.1),inset 0 1px 0 rgba(255,255,255,.9)}
body.dark .glass{box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.card{padding:22px;margin-bottom:16px;min-width:0}
.card h3{font-size:17px;margin-bottom:14px}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,calc((100% - 1100px)/2)) 10px;border-radius:0;border-width:0 0 1px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#183a93 34%,#27cdff 34% 67%,#d92aa1 67%)}
.top .brand{flex:1;min-width:0}.brand b{display:block;font-size:14px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;font-size:11px;color:var(--mut);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{display:flex;gap:8px;align-items:center}.top .nm{font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mg .top{display:none}
main{max-width:1100px;margin:0 auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom))}
body.mg main{max-width:none;padding:0 0 0 252px}
/* forms */
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--fld);color:var(--ink);font:inherit}
textarea{height:96px;padding:11px 13px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
input[readonly],textarea[readonly]{opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 20px;border:1px solid transparent;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;color:#fff;background:linear-gradient(135deg,#183a93,#2b5fd6);box-shadow:0 4px 12px rgba(24,58,147,.28)}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.55;cursor:wait}
.btn.s{background:var(--tint);color:var(--navy);border-color:var(--line);box-shadow:none}
.btn.g{background:rgba(24,167,122,.15);color:var(--ok);box-shadow:none}.btn.r{background:rgba(223,89,101,.15);color:var(--bad);box-shadow:none}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}.btn.full{width:100%;height:48px;margin-top:20px}
.msg{padding:11px 14px;border-radius:12px;margin-top:14px;font-weight:500}.msg.er{background:rgba(223,89,101,.14);color:var(--bad)}.msg.ok{background:rgba(24,167,122,.14);color:var(--ok)}
.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:4px;top:3px;width:38px;height:38px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;text-decoration:underline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tabs{display:flex;gap:4px;padding:5px;background:var(--tint);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;height:40px;border:0;border-radius:10px;background:none;color:var(--mut);font:inherit;font-weight:700;cursor:pointer}.tabs button.on{background:var(--glass);color:var(--navy);box-shadow:0 2px 10px rgba(24,58,147,.15)}
/* auth */
.authBox{max-width:440px;margin:24px auto 0;padding:30px 28px}
.lc{display:flex;gap:13px;align-items:center;margin-bottom:22px}.lc svg{flex:none;border-radius:12px}
.authBox h1{font-size:30px;letter-spacing:-.8px;line-height:1.15;margin:0 0 20px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--tint);margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th{padding:12px 14px;text-align:left;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);background:var(--tint);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}tbody tr:hover td{background:rgba(39,205,255,.07)}
.c1{font-weight:600}.c2{font-size:12px;color:var(--mut)}.clamp{max-width:230px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;gap:8px}.empty{padding:34px 12px;text-align:center;color:var(--mut)}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--tint);color:var(--navy)}
.b.APPROVED,.b.PRESENT,.b.ACTIVE{background:rgba(24,167,122,.16);color:var(--ok)}.b.PENDING,.b.ON\ LEAVE,.b.OFF{background:rgba(233,154,53,.18);color:var(--warn)}.b.REJECTED,.b.ABSENT,.b.INACTIVE,.b.NO\ LOG,.b.NO\ TIME\ OUT,.b.NO\ TIME\ IN{background:rgba(223,89,101,.16);color:var(--bad)}
/* stats + calendar */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:15px 17px;border-radius:14px;background:var(--glass);border:1px solid var(--gb);border-left:4px solid var(--cy)}.stat b{display:block;font-size:26px;line-height:1.2}.stat span{font-size:13px;color:var(--mut)}
.stat.wa{border-left-color:var(--mg)}.stat.ok{border-left-color:#18a77a}.stat.er{border-left-color:#df5965}
.dtrHead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.dtrHead b{font-size:17px;display:block}.dtrHead span{color:var(--mut);font-size:13px}.dlRow{display:flex;gap:10px;flex-wrap:wrap}
.cal{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:6px}.cal h4{margin:0 0 12px;font-size:15px}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:14px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.dn{text-align:center;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
.dc{min-height:76px;min-width:0;padding:7px 9px;border:1px solid var(--line);border-left:4px solid #cfd8e6;border-radius:10px;background:var(--fld);overflow:hidden}.dc.e{visibility:hidden}
.dc b{display:block;font-size:15px}.dc small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc em{display:block;font-style:normal;font-size:11px;font-weight:700}
.dc.present{border-left-color:#17a879;background:rgba(23,168,121,.1)}.dc.late{border-left-color:#e99a35;background:rgba(233,154,53,.13)}.dc.under{border-left-color:#8262d8;background:rgba(130,98,216,.11)}.dc.absent,.dc.missing{border-left-color:#df5965;background:rgba(223,89,101,.1)}.dc.leave{border-left-color:#2589c3;background:rgba(37,137,195,.11)}.dc.off{border-left-color:#9aa7bd}
.note{padding:12px 14px;border-radius:12px;background:rgba(233,154,53,.16);color:var(--warn);margin-bottom:16px}
/* employee */
.empTop h2{font-size:20px}.empTop p{color:var(--mut)}
.nav{position:fixed;z-index:25;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:20px}
.nav button{border:0;background:none;border-radius:14px;padding:8px 2px;color:var(--mut);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.nav button svg{width:21px;height:21px}.nav button.on{color:var(--navy);background:var(--tint)}
.cutRow{display:flex;gap:10px}.cutRow select{flex:1;min-width:0}
.prof{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--tint);margin:14px 0}.av{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--cy),var(--mg));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
/* management */
.side{position:fixed;inset:0 auto 0 0;width:252px;z-index:40;display:flex;flex-direction:column;padding:18px 14px 16px;background:var(--glass);border-right:1px solid var(--gb);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:8px 0 30px rgba(24,58,147,.08),inset -1px 0 0 rgba(255,255,255,.7)}
.side .brand{display:flex;gap:11px;align-items:center;padding:0 4px 16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.lgo{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;background:linear-gradient(135deg,#183a93,#27cdff 60%,#d92aa1);box-shadow:0 4px 12px rgba(24,58,147,.28)}
.side .brand b{font-size:14px;letter-spacing:0}.side .brand span{font-size:11.5px;letter-spacing:0}
.slabel{font-size:12px;font-weight:700;color:var(--mut);padding:0 6px;margin-bottom:10px}
.snav{display:grid;gap:8px}
.snav button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
body.dark .snav button{background:rgba(255,255,255,.05);box-shadow:none}
.snav svg{width:19px;height:19px;flex:none;color:var(--mut)}
.snav button:hover{background:rgba(39,205,255,.1)}
.snav button.on{background:linear-gradient(180deg,rgba(39,205,255,.2),rgba(24,58,147,.1));border-color:rgba(24,58,147,.3);color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
.snav button.on svg{color:var(--navy)}
.sbot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:12px}
.schip{display:flex;align-items:center;gap:8px;align-self:start;max-width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.6);font-size:12px;font-weight:600}
body.dark .schip{background:rgba(255,255,255,.06)}
.schip:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#18a77a}.schip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sacts button{height:40px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.6);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}.sacts button:hover{background:rgba(24,58,147,.08)}
body.dark .sacts button{background:rgba(255,255,255,.06)}
.mtact{display:none;gap:10px}
.mgm{max-width:1300px;margin:0 auto;padding:30px 34px 56px}
.mgTop{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}.mgTop h1{font-size:28px;letter-spacing:-.6px}.mgTop p{color:var(--mut);margin-top:4px}
.bar,.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.bar{justify-content:space-between}
.f{display:grid;gap:6px;min-width:160px}.f label{margin:0}.f select,.f input{height:42px}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin-top:16px;padding:18px;border:1px dashed var(--line);border-radius:14px}
summary.btn{list-style:none;width:max-content;margin-top:16px}summary.btn::-webkit-details-marker{display:none}
.sh{height:36px;width:auto;min-width:130px;font-size:13px}
dialog{border:0;border-radius:18px;padding:24px;width:min(440px,92%);color:var(--ink);background:var(--glass),#fff}body.dark dialog{background:#141d3e}dialog::backdrop{background:rgba(10,17,40,.5);backdrop-filter:blur(3px)}
dialog h3{margin-bottom:12px}code{background:var(--tint);padding:6px 10px;border-radius:8px;user-select:all;font-size:16px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 14px}.dl dt{color:var(--mut);font-weight:600}.dl dd{margin:0;word-break:break-word}
@media(max-width:900px){
 body.mg main{padding:64px 0 0}
 .side{inset:0 0 auto 0;width:100%;height:60px;flex-direction:row;align-items:center;gap:8px;padding:8px 12px}.side::after{inset:auto 0 0 0;width:auto;height:3px;background:linear-gradient(90deg,#27cdff,#d92aa1)}
 .side .brand{border:0;margin:0;padding:0}.side .brand>div:last-child,.sbot,.slabel{display:none}.snav button{border:0;background:none;box-shadow:none;height:40px}.snav button.on{box-shadow:inset 0 -3px 0 var(--navy);border-radius:10px 10px 0 0}.mtact{display:flex}.mtact .btn{flex:1}.snav{display:flex;flex:1;overflow-x:auto;justify-content:space-around}.snav button{width:auto;padding:0 12px;font-size:13px}.snav svg{display:none}
 .mgm{padding:20px 14px 40px}.mgTop h1{font-size:23px}.f,.filters{width:100%}.bar>.btn{width:100%}.mtact{width:100%}
}
@media(max-width:760px){
 .card{padding:16px}.authBox{padding:24px 18px}.top .nm{display:none}
 .rt thead{display:none}.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}.tw.rw{border:0;background:none;overflow:visible}
 .rt tr{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:6px 14px;background:var(--glass)}.rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:9px 0;text-align:right}
 .rt td::before{content:attr(data-l);font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;text-align:left;flex:none}.rt td:first-child{display:block;text-align:left;border-bottom:1px solid var(--line);margin-bottom:4px}.rt td:first-child::before,.rt td.nl::before{display:none}.rt tr.re{display:none}
 .clamp{max-width:none}.cg{gap:4px}.dc{min-height:46px;padding:5px 2px;text-align:center;border-left-width:1px;border-bottom:4px solid #cfd8e6}.dc small,.dc em{display:none}.dc b{font-size:13px}.dc.present{border-bottom-color:#17a879}.dc.late{border-bottom-color:#e99a35}.dc.under{border-bottom-color:#8262d8}.dc.absent,.dc.missing{border-bottom-color:#df5965}.dc.leave{border-bottom-color:#2589c3}
 .dl{grid-template-columns:1fr}.dlRow .btn,.dtrHead .dlRow{width:100%}.stats{grid-template-columns:1fr 1fr;gap:10px}
}
@media print{.top,.nav,.side,.dlRow,.f,.filters,.mgTop{display:none!important}body{background:#fff}body.mg main{padding:0}.glass{box-shadow:none;border:0}}
</style>
</head>
<body>
<header class="top glass"><svg viewBox="0 0 40 40" width="38" height="38"><rect width="40" height="40" rx="9" fill="#fff"/><path d="M9 6h12a9 9 0 0 1 0 14L9 20z" fill="#183a93"/><path d="M9 20h14a9 9 0 0 1 0 14H9z" fill="#d92aa1"/><path d="M9 12l12 8-12 8z" fill="#27cdff"/></svg>
<div class="brand"><b>BETTER EDGE SOLUTIONS INC.</b><span>Attendance portal</span></div>
<div class="who"><span class="nm hide" id="whoTxt"></span><button class="btn s sm hide" id="outBtn" onclick="logout()">Log out</button><button class="btn s sm" onclick="toggleDark()">&#9680;</button></div></header>
<main>
<section id="auth"><div class="authBox glass">
 <div class="lc"><svg viewBox="0 0 40 40" width="46" height="46"><rect width="40" height="40" rx="9" fill="#fff"/><path d="M9 6h12a9 9 0 0 1 0 14L9 20z" fill="#183a93"/><path d="M9 20h14a9 9 0 0 1 0 14H9z" fill="#d92aa1"/><path d="M9 12l12 8-12 8z" fill="#27cdff"/></svg><div class="brand"><b>BETTER EDGE SOLUTIONS</b><span>SORTER ATTENDANCE</span></div></div>
 <h1 id="authH">Welcome back</h1>
 <div class="tabs" id="authTabs" style="margin-bottom:6px"><button class="on" data-t="aLogin">Sorter</button><button data-t="aHR">Management</button></div>
 <div id="aLogin">
  <div id="sLog"><label for="le">Email</label><input id="le" type="email" autocomplete="username" placeholder="name@email.com">
   <label for="lp">6-digit PIN</label><div class="pw"><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN"><button type="button" class="eye" onclick="togglePw('lp')"></button></div>
   <button class="btn full" onclick="empLogin(this)">Sign in</button>
   <p style="text-align:center;margin-top:16px;color:var(--mut)">New sorter? <button type="button" class="lnk" onclick="showReg(true)">Register</button></p></div>
  <div id="aReg" class="hide"><label for="rl">LDC</label><select id="rl"><option value="">Select LDC</option><option value="LDC1">LDC 1</option><option value="LDC2">LDC 2</option></select>
   <label for="rn">Full name</label><input id="rn" placeholder="As in master list">
   <label for="re">Email</label><input id="re" type="email" placeholder="name@email.com">
   <label for="rp">Create 6-digit PIN</label><div class="pw"><input id="rp" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button type="button" class="eye" onclick="togglePw('rp')"></button></div>
   <label for="rc">Confirm PIN</label><div class="pw"><input id="rc" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button type="button" class="eye" onclick="togglePw('rc')"></button></div>
   <button class="btn full" onclick="register(this)">Create account</button>
   <p style="text-align:center;margin-top:16px;color:var(--mut)">Have an account? <button type="button" class="lnk" onclick="showReg(false)">Sign in</button></p></div>
 </div>
 <div id="aHR" class="hide"><label for="hu">Username</label><input id="hu" autocomplete="username"><label for="hp">Password</label><div class="pw"><input id="hp" type="password" autocomplete="current-password"><button type="button" class="eye" onclick="togglePw('hp')"></button></div><button class="btn full" onclick="hrLogin(this)">Sign in</button></div>
 <div id="authMsg"></div></div></section>

<section id="emp" class="hide">
 <div class="card glass empTop"><h2 id="eName"></h2><p id="eMeta"></p></div>
 <div id="eDtr" class="card glass"><h3>My DTR</h3><div class="cutRow"><select id="ec"></select><button class="btn" onclick="loadMyDtr(this)">View</button></div><div id="eDtrBody" style="margin-top:16px"></div></div>
 <div id="eFile" class="card glass hide"><h3>Absent filing</h3><div class="grid2"><div><label>Type</label><select id="ft" onchange="$('fdw').classList.toggle('hide',this.value!=='LEAVE')"><option value="ABSENT">Absent (1 day)</option><option value="LEAVE">Leave (multi-day)</option></select></div><div><label>Start date</label><input id="fs" type="date"></div><div id="fdw" class="hide"><label>Days (max 14)</label><input id="fd" type="number" min="1" max="14" value="1"></div></div><label>Reason</label><textarea id="fr" maxlength="500"></textarea><button class="btn full" style="width:auto;margin-top:16px;height:42px" onclick="submitFiling(this)">Submit filing</button><div id="fMsg"></div><h3 style="margin:26px 0 0">My filings</h3><div id="eListBody"></div></div>
 <div id="ePw" class="card glass hide" style="max-width:520px"><h3>Change PIN</h3><div id="ePwBox"></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwDooIDpYRhQfGNlY3RmmR0rqVTTq7mSV826Xj5Mp63nTqczneLQdG_aOsLyj-qnBKj/exec';
window.google={script:{run:(function mk(ok,no){return new Proxy({},{get:(t,p)=>{
 if(p==='withSuccessHandler')return f=>mk(f,no);if(p==='withFailureHandler')return f=>mk(ok,f);
 return(...a)=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:p,args:a})}).then(r=>r.json()).then(j=>j.error?no&&no({message:j.error}):ok&&ok(j.result)).catch(()=>no&&no({message:'Network error. Check your connection.'}))}})})()}};
</script>
<script>
const $=s=>document.getElementById(s);
const SH=['7PM-4AM','8PM-5AM','9PM-6AM','12AM-9AM','1AM-10AM'];
const S={tok:null,mustChange:false,isOwner:false};let FIL=[],EMPS=[];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>s?`<span class="b ${esc(s)}">${esc(s)}</span>`:'';
const opt=(v,t,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(t)}</option>`;
const shiftOpts=c=>opt('','Not set',!c)+SH.map(s=>opt(s,s.replace('-',' - '),s===c)).join('');
const fd=s=>{const d=new Date(String(s).slice(0,10)+'T12:00:00');return isNaN(d)?esc(s||''):d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const td=(l,h,c)=>`<td data-l="${l}"${c?` class="${c}"`:''}>${h}</td>`;
const mtable=(cols,rows,empty)=>rows.length?`<div class="tw rw"><table class="rt"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${esc(empty)}</div>`;
function call(fn,...a){return new Promise(ok=>google.script.run.withSuccessHandler(r=>{if(r&&r.sessionExpired){logout('Your session expired. Please log in again.');return}ok(r||{})}).withFailureHandler(e=>ok({success:false,message:e.message||'Something went wrong. Try again.'}))[fn](...a))}
async function run(b,fn,...a){const t=b&&b.textContent;if(b){b.disabled=true;b.textContent='Please wait...'}const r=await call(fn,...a);if(b){b.disabled=false;b.textContent=t}return r}
const msg=(id,r,ok)=>$(id).innerHTML=`<div class="msg ${r.success?'ok':'er'}">${esc(r.success?ok:r.message)}</div>`;
function dlg(t,h){$('dT').textContent=t;$('dB').innerHTML=h;$('dlg').showModal()}
const tempDlg=(t,who,pin)=>dlg(t,`<p>Temporary PIN for <b>${esc(who)}</b> (shown once):</p><p style="margin-top:12px"><code>${esc(pin)}</code></p>`);
function toggleDark(){const d=document.body.classList.toggle('dark');try{localStorage.setItem('besi-dark',d?'1':'0')}catch(e){}}
try{if(localStorage.getItem('besi-dark')==='1')document.body.classList.add('dark')}catch(e){}
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
document.querySelectorAll('.eye').forEach(b=>b.innerHTML=EYE);
const togglePw=id=>{const i=$(id);i.type=i.type==='password'?'text':'password'};
function syncHead(){const hr=!$('aHR').classList.contains('hide'),rg=!$('aReg').classList.contains('hide');$('authH').textContent=hr?'Management sign in':rg?'Create account':'Welcome back'}
function showReg(on){$('sLog').classList.toggle('hide',on);$('aReg').classList.toggle('hide',!on);$('authMsg').innerHTML='';syncHead()}
$('authTabs').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;[...$('authTabs').children].forEach(b=>{b.classList.toggle('on',b===e.target);$(b.dataset.t).classList.toggle('hide',b.dataset.t!==t)});$('authMsg').innerHTML='';syncHead()});
function show(w){['auth','emp','hr'].forEach(s=>$(s).classList.toggle('hide',s!==w));$('empNav').classList.toggle('hide',w!=='emp');$('whoTxt').classList.toggle('hide',w!=='emp');$('outBtn').classList.toggle('hide',w!=='emp')}
function logout(m){S.tok=null;S.mustChange=false;document.body.classList.remove('mg');show('auth');['le','lp','hu','hp'].forEach(i=>$(i).value='');$('authMsg').innerHTML=m?`<div class="msg er">${esc(m)}</div>`:''}
function pwForm(box,fn){$(box).innerHTML=`<label>Current password</label><input id="${box}o" type="password"><label>New password</label><input id="${box}n" type="password"><label>Confirm new password</label><input id="${box}c" type="password"><button class="btn" style="margin-top:18px" id="${box}b">Update password</button><div id="${box}m"></div>`;
 $(box+'b').onclick=async()=>{if($(box+'n').value!==$(box+'c').value){msg(box+'m',{message:'New passwords do not match.'});return}const r=await run($(box+'b'),fn,S.tok,$(box+'o').value,$(box+'n').value);msg(box+'m',r,'Password updated.');if(r.success){S.mustChange=false;$(box+'o').value=$(box+'n').value=$(box+'c').value=''}}}

/* AUTH */
async function empLogin(b){if(!/^\d{6}$/.test($('lp').value)){msg('authMsg',{message:'Enter your 6-digit PIN.'});return}const r=await run(b,'employeeLogin',$('le').value,$('lp').value);if(!r.success){msg('authMsg',r);return}
 S.tok=r.token;const e=r.employee;$('eName').textContent=e.employeeName;$('eMeta').textContent=`${e.employeeId}  |  ${e.ldc.replace('LDC','LDC ')}  |  ${e.shiftLabel}`;$('whoTxt').textContent=e.employeeName;$('fs').value=new Date().toISOString().slice(0,10);
 pinForm();show('emp');openEmpTab('eDtr');loadProfile()}
async function register(b){if(!/^\d{6}$/.test($('rp').value)){msg('authMsg',{message:'PIN must be exactly six digits.'});return}if($('rp').value!==$('rc').value){msg('authMsg',{message:'PINs do not match.'});return}
 const r=await run(b,'registerEmployee',$('rl').value,$('rn').value,$('re').value,$('rp').value,$('rc').value);if(!r.success){msg('authMsg',r);return}
 $('le').value=$('re').value;['rl','rn','re','rp','rc'].forEach(i=>$(i).value='');showReg(false);msg('authMsg',r,`Welcome, ${r.employeeName}. Your account is ready. Log in to continue.`)}
async function hrLogin(b){const r=await run(b,'hrLogin',$('hu').value,$('hp').value);if(!r.success){msg('authMsg',r);return}
 S.tok=r.token;S.isOwner=r.isOwner;S.mustChange=!!r.mustChange;$('whoTxt').textContent=r.hrName+(r.isOwner?' (Owner)':'');pwForm('hPwBox','changeHRPassword');
 show('hr');document.body.classList.add('mg');managementNav(r.mustChange?'hP':'hF');if(r.mustChange)$('hPwBox').insertAdjacentHTML('beforebegin','<div class="msg er">Temporary password in use. Set a new one to continue.</div>')}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;const m={le:1,lp:1,hu:2,hp:2}[e.target.id];if(m===1)empLogin($('aLogin').querySelector('.btn.full'));if(m===2)hrLogin($('aHR').querySelector('.btn'))});

/* MANAGEMENT NAV */
const TITLES={hF:['Filings','Review absence and leave filings'],hE:['Employees','Roster, shifts and profiles'],hD:['DTR','Attendance by cutoff'],hP:['Account','Password and access']};
function managementNav(p){if(S.mustChange&&p!=='hP')return;
 ['hF','hE','hD','hP'].forEach(id=>$(id).classList.toggle('hide',id!==p));$('hA').classList.toggle('hide',!(p==='hP'&&S.isOwner));
 document.querySelectorAll('#managementNav button').forEach(b=>b.classList.toggle('on',b.dataset.panel===p));
 $('mgTitle').textContent=TITLES[p][0];$('mgSub').textContent=TITLES[p][1];
 const n=$('whoTxt').textContent.replace(' (Owner)','');$('mgUser').textContent=n;
 if(p==='hE')loadEmps();if(p==='hF')loadFilings();if(p==='hP'&&S.isOwner)loadHR();
 if(p==='hD')$('hDBody').innerHTML='<div class="empty">Choose an LDC, cutoff and employee.</div>';window.scrollTo(0,0)}
$('managementNav').addEventListener('click',e=>{const b=e.target.closest('button[data-panel]');if(b)managementNav(b.dataset.panel)});

/* CUTOFF ARCHIVE */
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function cutEnd(t){t=String(t);const m=t.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i),y=t.match(/\b(20\d\d)\b/),d=t.match(/(\d{1,2})\s*(?:-|–|—|to)\s*(\d{1,2})/);return m&&y&&d?new Date(+y[1],MON[m[1].toLowerCase().slice(0,3)],+d[2],23,59,59):null}
const isArchCut=t=>{const e=cutEnd(t);return !!e&&Date.now()-e.getTime()>3*864e5};
function fillCut(sel,tabs){const cur=tabs.filter(t=>!isArchCut(t)),old=tabs.filter(isArchCut),g=(l,a)=>a.length?`<optgroup label="${l}">${a.map(t=>opt(t,t)).join('')}</optgroup>`:'';sel.innerHTML=g('Current cutoff',cur)+g('Archive ('+old.length+')',old);if(cur.length)sel.value=cur[cur.length-1]}
function isArchFiling(x){if(x.status==='PENDING')return false;const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate()<=15?1:16),d=new Date((x.endDate||x.startDate)+'T12:00:00');return !isNaN(d)&&d<s}
const arcOk=(x,m)=>m==='all'||(m==='arc'?isArchFiling(x):!isArchFiling(x));

/* DOWNLOADS */
let LASTDTR=null,DTRCTX={},LASTSUM=null;
function saveXlsx(name,sheets){if(!window.XLSX){dlg('Download unavailable','The Excel library could not load. Check your connection and try again.');return}
 const wb=XLSX.utils.book_new(),bd={style:'thin',color:{rgb:'C9D3E3'}},B={top:bd,bottom:bd,left:bd,right:bd};
 sheets.forEach(sh=>{const ws=XLSX.utils.aoa_to_sheet(sh.rows),h=sh.hr==null?0:sh.hr,rg=XLSX.utils.decode_range(ws['!ref']);
  for(let r=0;r<=rg.e.r;r++)for(let c=0;c<=rg.e.c;c++){const a=XLSX.utils.encode_cell({r,c}),x=ws[a];if(!x)continue;
   if(r===h)x.s={fill:{patternType:'solid',fgColor:{rgb:'1F4E79'}},font:{bold:true,color:{rgb:'FFFFFF'},sz:11,name:'Calibri'},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:B};
   else if(r>h&&sh.body!==false)x.s={font:{sz:11,name:'Calibri'},alignment:{vertical:'center'},border:B}}
  ws['!cols']=(sh.widths||[]).map(w=>({wch:w}));ws['!rows']=[];ws['!rows'][h]={hpt:32};
  if(sh.filter!==false){ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:h,c:0},e:{r:rg.e.r,c:rg.e.c}})}}
  if(sh.freeze){const f=sh.freeze;ws['!freeze']={xSplit:String(f),ySplit:String(h+1),topLeftCell:XLSX.utils.encode_cell({r:h+1,c:f}),activePane:'bottomRight',state:'frozen'}}
  XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31))});XLSX.writeFile(wb,name.replace(/[^\w.-]+/g,'_')+'.xlsx')}
const DLROW=f=>`<div class="dlRow"><button class="btn" onclick="${f}">Download Excel</button><button class="btn s" onclick="window.print()">Print / PDF</button></div>`;
function dlDtr(){const r=LASTDTR;if(!r||!r.success)return;const t=r.totals||{},c=DTRCTX,cut=r.tab||c.cut;
 saveXlsx('DTR_'+c.name+'_'+cut,[{name:'Summary',hr:7,body:false,filter:false,widths:[22,34,12,12,16,12],rows:[['Better Edge Solutions Inc.'],['Daily Time Record'],[],['Employee',c.name],['Details',c.meta],['Cutoff',cut],[],['Days worked','Total hours','OT hours','Late (min)','Undertime (min)','Absences'],[t.daysRendered||0,t.hours||0,t.overtimeHours||0,t.lateMinutes||0,t.undertimeMinutes||0,t.absences||0]]},
 {name:'Attendance',freeze:2,widths:[12,8,11,11,9,9,11,14,24],rows:[['Date','Day','Time in','Time out','Hours','Late','Undertime','Status','Filing'],...(r.rows||[]).map(x=>[x.date,x.day,x.timeIn,x.timeOut,x.hours,x.late,x.undertime,x.status,x.filing])]}])}
function dlSummary(){const s=LASTSUM;if(!s)return;saveXlsx('DTR_summary_'+s.ldc+'_'+s.cut,[{name:'LDC summary',freeze:2,widths:[12,30,14,8,9,11,15,10,8],rows:[['ID','Name','Shift','Days','Hours','Late (min)','Undertime (min)','Absences','Leaves'],...s.rows.map(x=>x.found?[x.employeeId,x.employeeName,x.shiftLabel,x.totals.daysRendered,x.totals.hours,x.totals.lateMinutes,x.totals.undertimeMinutes,x.totals.absences,x.totals.leaves]:[x.employeeId,x.employeeName,x.shiftLabel,'Not found in this cutoff'])]}])}
function dlFilings(){const f=$('hfs').value,rows=FIL.filter(x=>(!f||x.status===f)&&arcOk(x,$('hfa').value));if(!rows.length){dlg('Nothing to download','No filings match the current filters.');return}
 saveXlsx('Filings_'+new Date().toISOString().slice(0,10),[{name:'Filings',freeze:3,widths:[16,18,26,12,8,10,12,12,6,36,11,18],rows:[['Reference','Filed','Employee','Employee ID','LDC','Type','Start','End','Days','Reason','Status','Action by'],...rows.map(x=>[x.reference,x.timestamp,x.employeeName,x.employeeId,x.ldc,x.filingType,x.startDate,x.endDate,x.days,x.reason,x.status,x.actionBy])]}])}

/* EMPLOYEE */
function openEmpTab(t){['eDtr','eFile','ePw','eProfile'].forEach(id=>$(id).classList.toggle('hide',id!==t));[...$('empNav').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='eFile')loadMine();if(t==='eDtr')initDtr();window.scrollTo(0,0)}
$('empNav').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)openEmpTab(b.dataset.t)});
async function submitFiling(b){const r=await run(b,'submitEmployeeFiling',S.tok,$('ft').value,$('fs').value,$('fd').value,$('fr').value);msg('fMsg',r,'Filing submitted. Reference: '+r.reference);if(r.success){$('fr').value='';loadMine()}}
async function loadMine(){$('eListBody').innerHTML='<div class="empty">Loading...</div>';const r=await call('getEmployeeFilings',S.tok);if(!r.success){$('eListBody').innerHTML=`<div class="msg er">${esc(r.message)}</div>`;return}
 const cols=['Filed','Type','Dates','Reason','Status'],row=x=>'<tr>'+td('Filed',fd(x.timestamp))+td('Type',esc(x.filingType))+td('Dates',(x.endDate&&x.endDate!==x.startDate?fd(x.startDate)+' → '+fd(x.endDate):fd(x.startDate))+` · ${esc(x.days)}d`)+td('Reason',`<div class="clamp">${esc(x.reason)}</div>`)+td('Status',badge(x.status))+'</tr>',cur=r.records.filter(x=>!isArchFiling(x)),old=r.records.filter(isArchFiling);
 $('eListBody').innerHTML=mtable(cols,cur.map(row),'No filings in the current cutoff.')+(old.length?`<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Archived filings (${old.length})</summary>${mtable(cols,old.map(row),'')}</details>`:'')}
async function initDtr(){if($('ec').options.length)return;const r=await call('getCutoffTabs',S.tok);if(!r.success){$('eDtrBody').innerHTML=`<div class="msg er">${esc(r.message)}</div>`;return}fillCut($('ec'),r.tabs);loadMyDtr()}
function dayInfo(x){const st=String(x.status||'').toUpperCase(),late=Number(x.late)>0,ut=Number(x.undertime)>0;
 if(st.includes('ABSENT')||st==='NO LOG')return['absent',x.status||'Absent',''];if(st.includes('LEAVE'))return['leave','On leave',''];if(st==='OFF')return['off','Day off',''];if(st.includes('NO TIME'))return['missing',x.status,''];
 if(!x.timeIn&&!x.timeOut)return['','',''];return[late?'late':ut?'under':'present','',late?'Late '+x.late+'m':ut?'Short '+x.undertime+'m':'']}
function dtrView(r){LASTDTR=r;if(!r.success)return`<div class="msg er">${esc(r.message)}</div>`;const t=r.totals||{},rows=r.rows||[],c=DTRCTX||{};
 const stat=(v,l,k='')=>`<div class="stat ${k}"><b>${esc(v??0)}</b><span>${l}</span></div>`,parsed=rows.map(x=>({x,d:new Date(String(x.date)+'T12:00:00')})).filter(z=>!isNaN(z.d));
 let cal='';if(parsed.length)cal=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(n=>`<div class="dn">${n}</div>`).join('')+'<div class="dc e"></div>'.repeat(parsed[0].d.getDay())+parsed.map(z=>{const[k,lab,sub]=dayInfo(z.x),tip=[z.x.date,z.x.status,z.x.timeIn&&'In '+z.x.timeIn,z.x.timeOut&&'Out '+z.x.timeOut].filter(Boolean).join(' | ');
  return`<div class="dc ${k}" title="${esc(tip)}"><b>${z.d.getDate()}</b>${z.x.timeIn||z.x.timeOut?`<small>${esc(z.x.timeIn||'--')}</small><small>${esc(z.x.timeOut||'--')}</small>`:`<small>${esc(lab)}</small>`}${sub?`<em>${esc(sub)}</em>`:''}</div>`}).join('');
 const dot=(c,l)=>`<span><i style="background:${c}"></i>${l}</span>`;
 return`<div class="dtrHead"><div><b>${esc(c.name||'')}</b><span>${esc(c.meta||'')}${c.meta?' · ':''}${esc(r.tab||c.cut||'')}</span></div>${DLROW('dlDtr()')}</div>`
 +(r.shiftSet?'':'<div class="note">No shift is set for this employee, so late and undertime cannot be computed.</div>')
 +`<div class="stats">${stat(t.daysRendered,'Days worked')}${stat(t.hours,'Total hours')}${stat(t.overtimeHours||0,'OT hours','ok')}${stat(t.lateMinutes,'Late (min)','wa')}${stat(t.undertimeMinutes,'Undertime (min)','wa')}${stat(t.absences,'Absences','er')}</div>`
 +`<div class="cal"><h4>Attendance calendar</h4><div class="legend">${dot('#17a879','On time')}${dot('#e99a35','Late')}${dot('#8262d8','Undertime')}${dot('#df5965','Absent')}${dot('#2589c3','Leave')}${dot('#9aa7bd','Day off')}</div>${cal?`<div class="cg">${cal}</div>`:'<div class="empty">No dates in this cutoff.</div>'}</div>`
 +mtable(['Date','Time in','Time out','Hours','Late','Undertime','Status','Filing'],rows.map(x=>`<tr${x.timeIn||x.timeOut||x.status?'':' class="re"'}>`+td('Date',`<span class="c1">${esc(x.date)} · ${esc(x.day)}</span>`)+td('Time in',esc(x.timeIn||'-'))+td('Time out',esc(x.timeOut||'-'))+td('Hours',esc(x.hours||'-'))+td('Late',esc(x.late||'-'))+td('Undertime',esc(x.undertime||'-'))+td('Status',badge(x.status))+td('Filing',esc(x.filing||'-'))+'</tr>'),'No dates in this cutoff.')}
async function loadMyDtr(b){DTRCTX={name:$('eName').textContent,meta:$('eMeta').textContent,cut:$('ec').value};$('eDtrBody').innerHTML='<div class="empty">Loading...</div>';$('eDtrBody').innerHTML=dtrView(await run(b,'getMyDTR',S.tok,$('ec').value))}
function pinForm(){$('ePwBox').innerHTML=['Current PIN|pinOld','New PIN|pinNew','Confirm new PIN|pinConfirm'].map(s=>{const[l,i]=s.split('|');return`<label>${l}</label><input id="${i}" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`}).join('')+'<button class="btn" style="margin-top:18px" id="pinSaveBtn">Update PIN</button><div id="pinMsg"></div>';
 $('pinSaveBtn').onclick=async()=>{const o=$('pinOld').value,n=$('pinNew').value,c=$('pinConfirm').value;if(!/^\d{6}$/.test(o)||!/^\d{6}$/.test(n)){msg('pinMsg',{message:'Enter a valid six-digit PIN.'});return}if(n!==c){msg('pinMsg',{message:'New PINs do not match.'});return}
  const r=await run($('pinSaveBtn'),'changeEmployeePIN',S.tok,o,n);msg('pinMsg',r,'PIN updated.');if(r.success)$('pinOld').value=$('pinNew').value=$('pinConfirm').value=''}}
let SNAP={};const PF=['pName','pDob','pPhone','pEmergency','pEmergencyPhone','pAddress'];
const profileVals=()=>({employeeName:$('pName').value,dateOfBirth:$('pDob').value,contactNumber:$('pPhone').value,emergencyContactName:$('pEmergency').value,emergencyContactNumber:$('pEmergencyPhone').value,address:$('pAddress').value});
function setProfile(p){p=p||{};$('pName').value=p.employeeName||p.name||$('eName').textContent||'';$('pDob').value=(p.dateOfBirth||p.dob||'').slice(0,10);$('pPhone').value=p.contactNumber||'';$('pEmergency').value=p.emergencyContactName||p.emergencyContact||'';$('pEmergencyPhone').value=p.emergencyContactNumber||'';$('pAddress').value=p.address||'';
 $('profileNameHead').textContent=$('pName').value;$('profileEmailHead').textContent=p.email||$('le').value;$('profileAvatar').textContent=$('pName').value.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'BE';SNAP=profileVals();PF.forEach(i=>$(i).readOnly=true);$('profileActions').classList.add('hide');$('profileEditBtn').classList.remove('hide')}
async function loadProfile(){$('profileMsg').innerHTML='';const r=await call('getEmployeeProfile',S.tok);setProfile(r.success?(r.profile||r.employee||r):{employeeName:$('eName').textContent,email:$('le').value})}
function toggleProfileEdit(){PF.forEach(i=>$(i).readOnly=false);$('profileActions').classList.remove('hide');$('profileEditBtn').classList.add('hide')}
const cancelProfileEdit=()=>setProfile(SNAP);
async function saveProfile(b){const v=profileVals();if(!v.employeeName.trim()){msg('profileMsg',{message:'Full name is required.'});return}const r=await run(b,'updateEmployeeProfile',S.tok,v);msg('profileMsg',r,'Profile saved.');if(r.success){$('eName').textContent=v.employeeName;setProfile(v)}}

/* HR */
async function loadFilings(){$('hFBody').innerHTML='<div class="empty">Loading...</div>';const r=await call('getHRDashboard',S.tok,$('hfl').value);if(!r.success){$('hFBody').innerHTML=`<div class="msg er">${esc(r.message)}</div>`;return}
 FIL=r.records;const s=r.stats;$('hStats').innerHTML=`<div class="stat"><b>${s.total}</b><span>Total</span></div><div class="stat wa"><b>${s.pending}</b><span>Pending</span></div><div class="stat ok"><b>${s.approved}</b><span>Approved</span></div><div class="stat er"><b>${s.rejected}</b><span>Rejected</span></div>`;renderFilings()}
function renderFilings(){const f=$('hfs').value,pc=FIL.filter(x=>x.status==='PENDING').length;
 $('hFBody').innerHTML=mtable(['Employee','Type','Dates','Reason','Status','Action'],FIL.filter(x=>(!f||x.status===f)&&arcOk(x,$('hfa').value)).map(x=>{const rg=x.endDate&&x.endDate!==x.startDate?`${fd(x.startDate)} → ${fd(x.endDate)}`:fd(x.startDate),d=Number(x.days)||1,r=esc(x.reference);
  return'<tr>'+td('Employee',`<div class="c1">${esc(x.employeeName)}</div><div class="c2">${esc(x.employeeId)} · ${r}</div>`)+td('Type',`<div class="c1">${esc(x.filingType)}</div><div class="c2">${esc(x.ldc)}</div>`)+td('Dates',`<div class="c1">${rg}</div><div class="c2">${d} day${d>1?'s':''}</div>`)+td('Reason',`<div class="clamp" title="${esc(x.reason)}">${esc(x.reason)}</div>`)+td('Status',badge(x.status)+(x.actionBy?`<div class="c2">by ${esc(x.actionBy)}</div>`:''))
  +td('Action',x.status==='PENDING'?`<div class="act"><button class="btn sm g" onclick="decide(this,'${r}','APPROVED')">Approve</button><button class="btn sm r" onclick="decide(this,'${r}','REJECTED')">Reject</button></div>`:'—')+'</tr>'}),'No filings match these filters.')}
async function decide(b,ref,st){if(!confirm((st==='APPROVED'?'Approve':'Reject')+' this filing?'))return;const r=await run(b,'updateFilingStatus',S.tok,ref,st);if(!r.success)dlg('Could not update',esc(r.message));loadFilings()}
async function loadEmps(){$('hEBody').innerHTML='<div class="empty">Loading...</div>';const r=await call('getEmployeesForHR',S.tok,$('hel').value);if(!r.success){$('hEBody').innerHTML=`<div class="msg er">${esc(r.message)}</div>`;return}
 EMPS=r.employees;$('as').innerHTML=shiftOpts('');
 $('hEBody').innerHTML=mtable(['Employee','LDC','Shift','Status','Actions'],EMPS.filter(e=>!$('hes').value||String(e.status||'').toUpperCase()===$('hes').value).map(e=>{const id=esc(e.employeeId),on=e.status==='ACTIVE';
  return'<tr>'+td('Employee',`<div class="c1">${esc(e.employeeName)}</div><div class="c2">${id} · ${esc(e.email||'Not registered')}</div>`)+td('LDC',esc(e.ldc))+td('Shift',`<select class="sh" onchange="setShift(this,'${id}')">${shiftOpts(e.shift)}</select>`)+td('Status',badge(e.status))
  +td('Actions',`<div class="act"><button class="btn sm s" onclick="empDetails('${id}')">Details</button><button class="btn sm s" onclick="setStatus('${id}','${on?'INACTIVE':'ACTIVE'}')">${on?'Archive':'Restore'}</button></div>`)+'</tr>'}),'No employees found. Sync the master list or add one.')}
function empDetails(id){const e=EMPS.find(x=>x.employeeId===id);if(!e)return;const v=x=>esc(x||'—');
 dlg('Employee details',`<dl class="dl"><dt>Name</dt><dd>${v(e.employeeName)}</dd><dt>ID</dt><dd>${v(e.employeeId)}</dd><dt>LDC</dt><dd>${v(e.ldc)}</dd><dt>Email</dt><dd>${v(e.email)}</dd><dt>Birth date</dt><dd>${v(e.dateOfBirth)}</dd><dt>Contact</dt><dd>${v(e.contactNumber)}</dd><dt>Emergency</dt><dd>${v(e.emergencyContactName)}${e.emergencyContactNumber?' · '+esc(e.emergencyContactNumber):''}</dd><dt>Address</dt><dd>${v(e.address)}</dd></dl>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">${e.registered?`<button class="btn sm s" onclick="$('dlg').close();resetEmp(this,'${esc(id)}')">Reset PIN</button>`:''}<button class="btn sm r" onclick="$('dlg').close();rmEmp('${esc(id)}','${esc(e.employeeName)}')">Remove</button></div>`)}
async function setShift(sel,id){const r=await call('updateEmployeeShift',S.tok,id,sel.value);if(!r.success)dlg('Could not save shift',esc(r.message))}
async function setStatus(id,st){const r=await call('updateEmployeeStatus',S.tok,id,st);if(!r.success)dlg('Could not update',esc(r.message));loadEmps()}
async function resetEmp(b,id){if(!confirm("Reset this employee's PIN?"))return;const r=await run(b,'resetEmployeePIN',S.tok,id);r.success?tempDlg('PIN reset',r.employeeName,r.tempPassword):dlg('Could not reset',esc(r.message))}
async function rmEmp(id,n){if(!confirm('Remove '+n+' permanently? Their login is deleted too.'))return;const r=await call('removeEmployeeFromHR',S.tok,id);if(!r.success)dlg('Could not remove',esc(r.message));loadEmps()}
async function addEmp(b){const r=await run(b,'addEmployeeFromHR',S.tok,$('an').value,$('al').value,$('as').value);if(!r.success){dlg('Could not add',esc(r.message));return}$('an').value='';loadEmps()}
async function syncML(b){const r=await run(b,'syncMasterlists',S.tok);r.success?dlg('Master list sync',Object.keys(r.report).map(k=>`<p><b>${esc(k)}:</b> ${esc(r.report[k])}</p>`).join('')):dlg('Sync failed',esc(r.message));loadEmps()}
async function dtrLdc(){const l=$('dl').value;$('dc').innerHTML='';$('de').innerHTML='';$('hDBody').innerHTML='';if(!l)return;const[t,e]=await Promise.all([call('getCutoffTabsForHR',S.tok,l),call('getEmployeesForHR',S.tok,l)]);
 if(!t.success){$('hDBody').innerHTML=`<div class="msg er">${esc(t.message)}</div>`;return}fillCut($('dc'),t.tabs);$('de').innerHTML=(e.employees||[]).map(x=>opt(x.employeeId,x.employeeName+' ('+x.employeeId+')')).join('')}
async function hrDtr(b){if(!$('de').value)return;DTRCTX={name:($('de').selectedOptions[0]||{}).text||'',meta:$('dl').value,cut:$('dc').value};$('hDBody').innerHTML=dtrView(await run(b,'getDTRForHR',S.tok,$('de').value,$('dc').value))}
async function hrSummary(b){if(!$('dl').value)return;const r=await run(b,'getDTRSummaryForHR',S.tok,$('dl').value,$('dc').value);if(!r.success){$('hDBody').innerHTML=`<div class="msg er">${esc(r.message)}</div>`;return}
 LASTSUM={rows:r.rows,ldc:$('dl').value,cut:$('dc').value};
 $('hDBody').innerHTML=DLROW('dlSummary()')+mtable(['Employee','Shift','Days','Hours','Late','Undertime','Absences','Leaves'],r.rows.map(x=>'<tr>'+td('Employee',`<div class="c1">${esc(x.employeeName)}</div><div class="c2">${esc(x.employeeId)}</div>`)+td('Shift',esc(x.shiftLabel))+(x.found?td('Days',x.totals.daysRendered)+td('Hours',x.totals.hours)+td('Late',x.totals.lateMinutes)+td('Undertime',x.totals.undertimeMinutes)+td('Absences',x.totals.absences)+td('Leaves',x.totals.leaves):'<td colspan="6" class="c2 nl">Not found in this cutoff</td>')+'</tr>'),'No active employees in this LDC.')}
async function loadHR(){const r=await call('getHRAccountsForOwner',S.tok);if(!r.success){$('hABody').innerHTML=`<div class="msg er">${esc(r.message||'Owner access required.')}</div>`;return}
 $('hABody').innerHTML=mtable(['Name','Username','Email','Actions'],r.accounts.map(a=>{const u=esc(a.username);return'<tr>'+td('Name',`<div class="c1">${esc(a.name)}${a.isOwner?' (Owner)':''}</div>`)+td('Username',u)+td('Email',esc(a.email||'-'))+td('Actions',a.isOwner?'—':`<div class="act"><button class="btn sm s" onclick="rsHR(this,'${u}')">Reset PIN</button><button class="btn sm r" onclick="rmHR('${u}')">Remove</button></div>`)+'</tr>'}),'No HR accounts.')}
async function mkHR(b){const r=await run(b,'createHRAccount',S.tok,$('cn').value,$('cu').value,$('cm').value);if(!r.success){dlg('Could not create',esc(r.message));return}['cn','cu','cm'].forEach(i=>$(i).value='');tempDlg('HR account created',r.hrName+' ('+r.username+')',r.tempPassword);loadHR()}
async function rsHR(b,u){if(!confirm('Reset PIN for '+u+'?'))return;const r=await run(b,'resetHRPassword',S.tok,u);r.success?tempDlg('PIN reset',r.username,r.tempPassword):dlg('Could not reset',esc(r.message))}
async function rmHR(u){if(!confirm('Remove HR account '+u+'?'))return;const r=await call('removeHRAccount',S.tok,u);if(!r.success)dlg('Could not remove',esc(r.message||''));loadHR()}
$('as').innerHTML=shiftOpts('');
</script>
